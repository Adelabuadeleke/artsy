<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Artsy" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://api.fontshare.com" />
    <!--
      Satoshi + Clash Display (Fontshare).

      One request per family on purpose. Fontshare's API silently drops every
      family after the first when several `f[]` parameters are combined in one
      URL, and it answers 200 with a partial stylesheet rather than an error —
      which is how Clash Display went missing from the home page headline with
      nothing to show for it in the console.
    -->
    <link
      rel="stylesheet"
      href="https://api.fontshare.com/v2/css?f%5B%5D=satoshi@300,400,500,700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://api.fontshare.com/v2/css?f%5B%5D=clash-display@200,400,500,600,700&display=swap"
    />
    <!-- STIX Two Text, Baskervville, Bellefair, Poppins, Rubik, Inter, Sora (Google Fonts) -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:wght@400;700&family=Baskervville&family=Bellefair&family=Poppins:ital,wght@0,300;0,400;1,400&family=Rubik:wght@500&family=Inter:wght@400;500;700&family=Sora:wght@400;600&display=swap"
    />
    <title>Artsy</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
